[package]
name = "trackhelm-app"
version = "0.1.0"
description = "TrackHelm Desktop App"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0" }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trackhelm-engine = { path = "../trackhelm-engine" }
