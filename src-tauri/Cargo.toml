[package]
name = "trackhelm-app"
version = "0.1.0"
description = "TrackHelm Desktop App"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
trackhelm-engine = { path = "../trackhelm-engine" }
